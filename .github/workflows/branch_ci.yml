
name: Branch CI (Python)
run-name: 'Branch CI for ${{ github.event.head_commit.message }} by ${{ github.actor }}'

on:  
  push:
    branches-ignore: [ "main" ]
    paths-ignore: ['README.md']

permissions:
  packages: write
  contents: read

jobs:
  branch-ci:
    uses: openclimatefix/.github/.github/workflows/branch_ci.yml@e15e8144ccd731f8e0771c42dce9c48c133dcf85
    secrets: inherit
    with:
      enable_linting: true
      enable_typechecking: false
      tests_folder: "tests"
      test_python_versions: '["3.12"]'
      tests_conda_deps: "libsqlite"
